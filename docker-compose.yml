services:
  # Servicio principal que incluye tanto Strapi como Astro
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "1337:1337"  # Puerto de Strapi
      - "4321:4321"  # Puerto de Astro
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=1337
      - DATABASE_CLIENT=sqlite
      - DATABASE_FILENAME=.tmp/data.db
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-here}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-your-admin-jwt-secret-here}
      - TRANSFER_TOKEN_SALT=${TRANSFER_TOKEN_SALT:-your-transfer-token-salt-here}
      - API_TOKEN_SALT=${API_TOKEN_SALT:-your-api-token-salt-here}
      - STRAPI_DISABLE_UPDATE_NOTIFICATION=true
      - STRAPI_HIDE_STARTUP_MESSAGE=true
    volumes:
      # Persistir la base de datos SQLite
      - strapi_data:/opt/app/server/.tmp
      # Persistir uploads
      - strapi_uploads:/opt/app/server/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1337/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Servicio opcional de base de datos PostgreSQL (comentado por defecto)
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: strapi
  #     POSTGRES_USER: strapi
  #     POSTGRES_PASSWORD: strapi
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped

  # Servicio opcional de Nginx como proxy reverso
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - app
  #   restart: unless-stopped

volumes:
  strapi_data:
    driver: local
  strapi_uploads:
    driver: local
  # postgres_data:
  #   driver: local

networks:
  default:
    name: astro-strapi-network