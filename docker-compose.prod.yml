services:
  # Servicio principal optimizado para producción
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "1337:1337"  # Puerto de Strapi
      - "4321:4321"  # Puerto de Astro
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=1337
      - DATABASE_CLIENT=sqlite
      - DATABASE_FILENAME=.tmp/data.db
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - TRANSFER_TOKEN_SALT=${TRANSFER_TOKEN_SALT}
      - API_TOKEN_SALT=${API_TOKEN_SALT}
      - STRAPI_DISABLE_UPDATE_NOTIFICATION=true
      - STRAPI_HIDE_STARTUP_MESSAGE=true
      - STRAPI_TELEMETRY_DISABLED=true
    volumes:
      # Persistir la base de datos SQLite
      - strapi_data:/opt/app/server/.tmp
      # Persistir uploads
      - strapi_uploads:/opt/app/server/public/uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1337/_health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  strapi_data:
    driver: local
  strapi_uploads:
    driver: local

networks:
  default:
    name: astro-strapi-prod-network